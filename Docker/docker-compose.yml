name: common-services

# ─────────────────────────────────────────────────────────
# BASE — común a todos los entornos
# Dev:    docker compose up -d
#         (carga docker-compose.override.yml automáticamente)
# Server: docker compose -f docker-compose.yml -f docker-compose.server.yml up -d
#
# Secrets: todos vienen del .env — sin Infisical por ahora.
# ─────────────────────────────────────────────────────────

services:

  auth-service:
    build:
      context: ..
      dockerfile: Docker/auth.Dockerfile
    expose:
      - "8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      # Base de datos
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=authservice;Username=postgres;Password=${POSTGRES_PASSWORD}
      # JWT
      - Jwt__SecretKey=${JWT_SECRET_KEY}
      - Jwt__Issuer=kauthen
      - Jwt__Audience=platform
      - Jwt__AccessTokenExpirationMinutes=${JWT_ACCESS_EXPIRATION:-15}
      - Jwt__RefreshTokenExpirationDays=${JWT_REFRESH_EXPIRATION:-7}
      # Seguridad
      - Lockout__MaxFailedAttempts=${LOCKOUT_MAX_ATTEMPTS:-5}
      - Lockout__LockoutDurationMinutes=${LOCKOUT_DURATION:-15}
      # Servicios internos
      - EmailService__BaseUrl=http://email-service:8080
      - App__BaseUrl=${APP_BASE_URL:-http://localhost:8080}
      # Logs (opcional — si Seq no está disponible, solo va a consola)
      - Seq__ServerUrl=${SEQ_URL:-http://seq:5341}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - kauthen-net
      - proxy-net
    restart: unless-stopped

  email-service:
    build:
      context: ..
      dockerfile: Docker/email.Dockerfile
    expose:
      - "8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      # SMTP
      - EmailConfiguration__FromName=${EMAIL_FROM_NAME}
      - EmailConfiguration__FromAddress=${EMAIL_FROM_ADDRESS}
      - EmailConfiguration__SmtpServer=${EMAIL_SMTP_SERVER:-smtp.gmail.com}
      - EmailConfiguration__Port=${EMAIL_SMTP_PORT:-587}
      - EmailConfiguration__UserName=${EMAIL_SMTP_USERNAME}
      - EmailConfiguration__Password=${EMAIL_SMTP_PASSWORD}
      # Logs (opcional)
      - Seq__ServerUrl=${SEQ_URL:-http://seq:5341}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - kauthen-net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=authservice
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kauthen-net
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  kauthen-net:
    name: kauthen-net
  proxy-net:
    name: proxy-net
    external: true
