# ─────────────────────────────────────────────────────────
# SERVER CONFIG — producción en homelab
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.server.yml up -d
#
# Este es el único contenedor con puerto expuesto al host.
# Todo el tráfico externo entra por aquí (vía Cloudflare Tunnel → :80).
# ─────────────────────────────────────────────────────────

services:

  gateway:
    container_name: gateway
    ports:
      - "${GATEWAY_PORT:-80}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
