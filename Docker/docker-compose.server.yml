# ─────────────────────────────────────────────────────────
# SERVER CONFIG — producción en homelab
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.server.yml up -d
#
# Requisito previo:
#   mkdir -p /mnt/data/apps/common-services/postgres
# ─────────────────────────────────────────────────────────

services:

  auth-service:
    ports:
      - "${AUTH_PORT:-8080}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production

  email-service:
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    # Sin ports — solo accesible internamente por auth-service

  postgres:
    volumes:
      - /mnt/data/apps/common-services/postgres:/var/lib/postgresql/data
    # Sin ports — solo accesible internamente por auth-service
