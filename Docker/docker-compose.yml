name: common-services

# ─────────────────────────────────────────────────────────
# BASE — común a todos los entornos
# Dev:    docker compose up -d
#         (carga docker-compose.override.yml automáticamente)
# Server: docker compose -f docker-compose.yml -f docker-compose.server.yml up -d
# ─────────────────────────────────────────────────────────

services:

  auth-service:
    build:
      context: ..
      dockerfile: Docker/auth.Dockerfile
    expose:
      - "8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      # Infisical
      - Infisical__Enabled=${INFISICAL_ENABLED:-false}
      - Infisical__SiteUrl=${INFISICAL_SITE_URL:-}
      - Infisical__ClientId=${INFISICAL_CLIENT_ID:-}
      - Infisical__ClientSecret=${INFISICAL_CLIENT_SECRET:-}
      - Infisical__ProjectId=${INFISICAL_PROJECT_ID:-}
      - Infisical__Environment=${INFISICAL_ENVIRONMENT:-prod}
      - Infisical__SecretPath=/
      # Secrets fallback (cuando Infisical está deshabilitado)
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=authservice;Username=postgres;Password=${POSTGRES_PASSWORD}
      - Jwt__SecretKey=${JWT_SECRET_KEY}
      - Jwt__Issuer=kauthen
      - Jwt__Audience=platform
      - Jwt__AccessTokenExpirationMinutes=${JWT_ACCESS_EXPIRATION:-15}
      - Jwt__RefreshTokenExpirationDays=${JWT_REFRESH_EXPIRATION:-7}
      - Lockout__MaxFailedAttempts=${LOCKOUT_MAX_ATTEMPTS:-5}
      - Lockout__LockoutDurationMinutes=${LOCKOUT_DURATION:-15}
      - EmailService__BaseUrl=http://email-service:8080
      - App__BaseUrl=${APP_BASE_URL:-http://localhost:8080}
      - Seq__ServerUrl=${SEQ_URL:-http://seq:5341}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - kauthen-net
    restart: unless-stopped

  email-service:
    build:
      context: ..
      dockerfile: Docker/email.Dockerfile
    expose:
      - "8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - Infisical__Enabled=${EMAIL_INFISICAL_ENABLED:-false}
      - Infisical__SiteUrl=${INFISICAL_SITE_URL:-}
      - Infisical__ClientId=${EMAIL_INFISICAL_CLIENT_ID:-}
      - Infisical__ClientSecret=${EMAIL_INFISICAL_CLIENT_SECRET:-}
      - Infisical__ProjectId=${EMAIL_INFISICAL_PROJECT_ID:-}
      - Infisical__Environment=${EMAIL_INFISICAL_ENVIRONMENT:-prod}
      - Infisical__SecretPath=/
      - Seq__ServerUrl=${SEQ_URL:-http://seq:5341}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - kauthen-net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=authservice
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kauthen-net
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  kauthen-net:
    name: kauthen-net
