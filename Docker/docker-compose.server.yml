# ─────────────────────────────────────────────────────────
# SERVER CONFIG — producción en homelab
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.server.yml up -d
#
# Requisitos previos en el server:
#   mkdir -p /mnt/data/apps/common-services/postgres
#   docker network create platform-net  (creado por docker-compose.platform.yml)
# ─────────────────────────────────────────────────────────

services:

  auth-service:
    ports:
      - "${AUTH_PORT:-8080}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    networks:
      - kauthen-net
      - platform-net
    restart: always

  email-service:
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    networks:
      - kauthen-net
      - platform-net
    restart: always

  postgres:
    volumes:
      - /mnt/data/apps/common-services/postgres:/var/lib/postgresql/data
    restart: always

networks:
  platform-net:
    external: true
    name: platform-net
