# ─────────────────────────────────────────────────────────
# SERVER CONFIG — producción en homelab
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.server.yml up -d
#
# Requisitos previos:
#   mkdir -p /mnt/data/apps/common-services/postgres
#   Gateway stack corriendo (proxy-net debe existir)
# ─────────────────────────────────────────────────────────

services:

  auth-service:
    # Sin ports — tráfico entra exclusivamente por el Gateway (proxy-net)
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    networks:
      - kauthen-net
      - proxy-net

  email-service:
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    # Sin ports — solo accesible internamente por auth-service

  postgres:
    volumes:
      - /mnt/data/apps/common-services/postgres:/var/lib/postgresql/data
    # Sin ports — solo accesible internamente

networks:
  proxy-net:
    external: true
    name: proxy-net
