# ─────────────────────────────────────────────────────────
# SERVER CONFIG — producción en homelab
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.server.yml up -d
#
# Requisitos previos en el server:
#   mkdir -p /mnt/data/apps/common-services/postgres
#   docker compose -f docker-compose.platform.yml up -d  ← crea platform-net
# ─────────────────────────────────────────────────────────

services:

  auth-service:
    ports:
      - "${AUTH_PORT:-8080}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    networks:
      - kauthen-net
      - platform-net   # solo para alcanzar Seq en la red de plataforma
    restart: unless-stopped

  email-service:
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    networks:
      - kauthen-net
      - platform-net   # solo para alcanzar Seq en la red de plataforma
    restart: unless-stopped

  postgres:
    volumes:
      - /mnt/data/apps/common-services/postgres:/var/lib/postgresql/data
    restart: unless-stopped

networks:
  platform-net:
    external: true
    name: platform-net
