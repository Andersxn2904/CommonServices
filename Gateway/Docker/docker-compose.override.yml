# ─────────────────────────────────────────────────────────
# DEV OVERRIDES — cargado automáticamente
#
# En dev el gateway escucha en :8000 para no pisar el :80 del host.
# El auth-service sigue accesible en :8080 directamente para Swagger.
# El gateway enruta a http://localhost:8080 (appsettings.Development.json)
# ─────────────────────────────────────────────────────────

services:

  gateway:
    container_name: gateway
    ports:
      - "8000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # En Docker los servicios se comunican por nombre de contenedor, no por localhost.
      # appsettings.Development.json usa localhost:8080 para correr el gateway fuera de Docker (dotnet run).
      - ReverseProxy__Clusters__kauthen__Destinations__primary__Address=http://auth-service:8080
