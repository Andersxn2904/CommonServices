name: common-services

services:
  auth-service:
    build:
      context: ..
      dockerfile: Docker/auth.Dockerfile
    container_name: auth-service
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      # Infisical — deshabilitar para pruebas locales (INFISICAL_ENABLED=false)
      - Infisical__Enabled=${INFISICAL_ENABLED:-false}
      - Infisical__SiteUrl=${INFISICAL_SITE_URL:-}
      - Infisical__ClientId=${INFISICAL_CLIENT_ID:-}
      - Infisical__ClientSecret=${INFISICAL_CLIENT_SECRET:-}
      - Infisical__ProjectId=${INFISICAL_PROJECT_ID:-}
      - Infisical__Environment=${INFISICAL_ENVIRONMENT:-prod}
      - Infisical__SecretPath=/
      # Secretos directos — solo usados cuando Infisical está deshabilitado
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=authservice;Username=postgres;Password=${POSTGRES_PASSWORD}
      - Jwt__SecretKey=${JWT_SECRET_KEY}
      # Configuración no sensible
      - Jwt__Issuer=kauthen
      - Jwt__Audience=platform
      - Jwt__AccessTokenExpirationMinutes=15
      - Jwt__RefreshTokenExpirationDays=7
      - Lockout__MaxFailedAttempts=5
      - Lockout__LockoutDurationMinutes=15
      - EmailService__BaseUrl=http://email-service:8080
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kauthen-net
    restart: unless-stopped

  email-service:
    build:
      context: ..
      dockerfile: Docker/email.Dockerfile
    container_name: email-service
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - Infisical__Enabled=${EMAIL_INFISICAL_ENABLED:-false}
      - Infisical__SiteUrl=${INFISICAL_SITE_URL:-}
      - Infisical__ClientId=${EMAIL_INFISICAL_CLIENT_ID:-}
      - Infisical__ClientSecret=${EMAIL_INFISICAL_CLIENT_SECRET:-}
      - Infisical__ProjectId=${EMAIL_INFISICAL_PROJECT_ID:-}
      - Infisical__Environment=${EMAIL_INFISICAL_ENVIRONMENT:-dev}
      - Infisical__SecretPath=/
    networks:
      - kauthen-net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: auth-postgres
    environment:
      - POSTGRES_DB=authservice
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kauthen-net
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  kauthen-net:
    name: kauthen-net
